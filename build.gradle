plugins { id 'java'; id 'net.neoforged.moddev' version '2.0.107' }
version = '0.1.0-dev'
group = 'fr.worldarchitect'
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
neoForge { version = '21.1.249'; runs { client { client() }; server { server() } }; mods { worldarchitect { sourceSet sourceSets.main } } }

repositories { maven { url = 'https://repo.terradevelopment.net/repository/maven-releases' } }
dependencies {
    implementation('dev.galacticraft:dynamicdimensions-neoforge:0.10.0')
    jarJar('dev.galacticraft:dynamicdimensions-neoforge:0.10.0')
}
